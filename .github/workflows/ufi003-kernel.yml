name: UFI003 IPsec kernel experiment
on:
  push:
    branches: [ufi003-ipsec-build]
    paths: [build-inputs/**]
permissions:
  contents: read
concurrency:
  group: ufi003-ipsec-kernel
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl xz-utils zstd gperf cpio bzip2 patch perl autoconf automake libtool cmake pkgconf ninja-build kmod
      - name: Prepare pinned source
        run: |
          set -eux
          curl -fL --retry 3 https://codeload.github.com/lkiuyu/immortalwrt/tar.gz/7fe583d96e -o source.tar.gz
          echo 'd9904fab62b30bffb4702c442627cbf713e56fbf7c48b39fe176b0fb8a53f010  source.tar.gz' | sha256sum -c -
          mkdir openwrt
          tar -xzf source.tar.gz --strip-components=1 -C openwrt
          cp build-inputs/feeds.conf openwrt/feeds.conf.default
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../build-inputs/openwrt.config .config
          make defconfig
          make download -j4
      - name: Build toolchain and prepare kernel
        run: |
          cd openwrt
          make tools/install -j4 V=s
          make toolchain/install -j4 V=s
          make target/linux/prepare V=s
      - name: Apply original kernel configuration plus IMS capabilities
        run: |
          set -eux
          cd openwrt
          kernel_dir=$(find build_dir -type d -name linux-6.12.85 | head -n1)
          test -n "$kernel_dir"
          gzip -dc ../build-inputs/linux.config.gz > "$kernel_dir/.config"
          "$kernel_dir/scripts/config" --file "$kernel_dir/.config" \
            --enable XFRM_USER --enable INET_ESP --enable INET6_ESP \
            --enable CRYPTO_MD5 --enable CRYPTO_HMAC --enable CRYPTO_NULL \
            --enable IKCONFIG --enable IKCONFIG_PROC --disable LOCALVERSION_AUTO
          # Kernel and all modules have a unique release, preserving the old module directory.
          "$kernel_dir/scripts/config" --file "$kernel_dir/.config" --set-str LOCALVERSION '-ufi-ims'
          # OpenWrt otherwise forces KERNELRELEASE=6.12.85 for external modules.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('include/kernel.mk')
          text = p.read_text()
          old = 'KERNELRELEASE=$(LINUX_VERSION)'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'KERNELRELEASE=6.12.85-ufi-ims'))
          PY
          cross=$(find "$PWD/staging_dir" -path '*/bin/aarch64-openwrt-linux-musl-gcc' | head -n1)
          test -x "$cross"
          export STAGING_DIR="$(dirname "$(dirname "$cross")")"
          prefix=${cross%gcc}
          make -C "$kernel_dir" ARCH=arm64 CROSS_COMPILE="$prefix" LOCALVERSION= olddefconfig
          cp "$kernel_dir/.config" "$kernel_dir/.config.set"
          cp "$kernel_dir/.config" "$kernel_dir/.config.prev"
          cp "$kernel_dir/.config" ../build-inputs/resolved-linux.config
          make -C "$kernel_dir" ARCH=arm64 CROSS_COMPILE="$prefix" LOCALVERSION= -j4 Image modules
          make -C "$kernel_dir" ARCH=arm64 CROSS_COMPILE="$prefix" LOCALVERSION= INSTALL_MOD_PATH="$PWD/../kernel-artifact" modules_install
          cp "$kernel_dir/arch/arm64/boot/Image" ../kernel-artifact/Image
          cp "$kernel_dir/System.map" ../kernel-artifact/System.map
      - name: Build matching wireless backports
        run: |
          cd openwrt
          # Toolchain and kernel are already built; avoid package dependencies rebuilding kernel config.
          make package/kernel/mac80211/compile NO_DEPS=1 -j4 V=s
          # Package build must preserve the same kernel release and configuration.
          kernel_dir=$(find build_dir -type d -name linux-6.12.85 | head -n1)
          cmp "$kernel_dir/.config" ../build-inputs/resolved-linux.config
          find build_dir -path '*/backports-*/*.ko' -print0 | while IFS= read -r -d '' module; do
            install -D "$module" "../kernel-artifact/lib/modules/6.12.85-ufi-ims/extra/$(basename "$module")"
          done
      - name: Validate and package
        run: |
          set -eux
          test -s kernel-artifact/Image
          test -s kernel-artifact/lib/modules/6.12.85-ufi-ims/extra/wcn36xx.ko
          test -s kernel-artifact/lib/modules/6.12.85-ufi-ims/extra/cfg80211.ko
          for config in XFRM XFRM_USER INET_ESP INET6_ESP CRYPTO_MD5; do
            grep -q "^CONFIG_$config=y$" build-inputs/resolved-linux.config
          done
          cp build-inputs/resolved-linux.config kernel-artifact/linux.config
          find kernel-artifact -name '*.ko' -exec sh -c 'strings "$1" | sed -n "s/^vermagic=//p"' sh {} \; | sort -u | tee kernel-artifact/vermagic.txt
          test "$(wc -l < kernel-artifact/vermagic.txt)" -eq 1
          grep -q '^6.12.85-ufi-ims ' kernel-artifact/vermagic.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = set(Path('build-inputs/expected-modules.txt').read_text().splitlines())
          actual = {p.name for p in Path('kernel-artifact').rglob('*.ko')}
          builtin = {Path(line).name for line in Path('kernel-artifact/lib/modules/6.12.85-ufi-ims/modules.builtin').read_text().splitlines()}
          missing = expected - actual - builtin
          assert not missing, f'Missing rebuilt modules: {sorted(missing)}'
          print(f'All {len(expected)} original modules covered: {len(expected & actual)} modules, {len(expected & builtin)} built in')
          PY
          depmod -b "$PWD/kernel-artifact" -F kernel-artifact/System.map 6.12.85-ufi-ims
          tar -czf ufi003-ipsec-kernel-experiment.tar.gz -C kernel-artifact .
          sha256sum ufi003-ipsec-kernel-experiment.tar.gz > ufi003-ipsec-kernel-experiment.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ufi003-ipsec-kernel-experiment
          path: |
            ufi003-ipsec-kernel-experiment.tar.gz
            ufi003-ipsec-kernel-experiment.sha256
          retention-days: 7
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ufi003-build-diagnostics
          path: |
            openwrt/logs
            openwrt/.config
            build-inputs/resolved-linux.config
            kernel-artifact
          retention-days: 7
